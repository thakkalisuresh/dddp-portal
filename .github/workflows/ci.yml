name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      # Fails if docs/ERROR_CODES.md drifted from the registry.
      - run: npm run errdoc && git diff --exit-code docs/ERROR_CODES.md
