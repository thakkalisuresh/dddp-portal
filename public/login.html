<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Diamond Park</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="appbar">
  <span class="appbar__who">Diamond Park</span>
</header>

<main class="page stack--lg stack" style="max-width:420px">
  <h1 id="heading">Member login</h1>

  <form class="stack" id="form" novalidate>
    <div id="alert" role="alert" aria-live="polite"></div>

    <div class="field">
      <label for="mobile">Mobile number</label>
      <!-- inputmode="tel", not "numeric": the numeric pad has no '+', so an
           owner abroad could not type their own login on a phone. Same as
           /forgot, which had it right. -->
      <input class="input num" id="mobile" name="mobile" type="tel" inputmode="tel"
             autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>

    <label class="checkline" for="remember">
      <input type="checkbox" id="remember" name="remember" checked>
      <span>Keep me logged in
        <span class="checkline__hint">Uncheck on a shared phone</span>
      </span>
    </label>

    <button class="btn btn--block btn--lg" id="submit" type="submit">Log in</button>
  </form>

  <p class="small muted">
    <a href="/forgot">Forgotten your password?</a><br>
    No email on your account? Contact <span id="treasurer">your treasurer</span>
  </p>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
