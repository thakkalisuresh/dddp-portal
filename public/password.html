<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a password — Diamond Park</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="appbar"><span class="appbar__who">Diamond Park</span></header>
<main class="page stack--lg stack" style="max-width:420px" id="main">
  <h1>Choose a password <span class="ml">പുതിയ പാസ്‌വേഡ്</span></h1>
  <p class="muted">You signed in with a temporary password. Pick your own to continue.</p>
  <form class="stack" id="form" novalidate>
    <div id="alert" role="alert" aria-live="polite"></div>
    <div class="field">
      <label for="pw">New password</label>
      <input class="input" id="pw" type="password" autocomplete="new-password" required autofocus>
      <span class="field__hint">At least 8 characters.</span>
    </div>
    <div class="field">
      <label for="pw2">Confirm</label>
      <input class="input" id="pw2" type="password" autocomplete="new-password" required>
    </div>
    <button class="btn btn--block btn--lg" id="submit" type="submit">Continue</button>
  </form>
</main>
<script type="module">
  import { api } from './js/api.js';
  import { $, el, showError } from './js/ui.js';

  const form = $('#form'), submit = $('#submit'), alertBox = $('#alert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.replaceChildren();
    const pw = $('#pw').value, pw2 = $('#pw2').value;

    if (pw.length < 8) return showError(alertBox, { message: 'Use at least 8 characters.' });
    // Checked here as well as server-side: a mistyped confirmation should be
    // caught before it becomes a password the resident cannot reproduce.
    if (pw !== pw2) return showError(alertBox, { message: 'Those two passwords do not match.' });

    submit.disabled = true;
    submit.textContent = 'Saving…';
    try {
      // The server ends every session on a password change, so a fresh login
      // is required — which is also the confirmation that it worked.
      await api.changePassword('', pw);
      $('#main').replaceChildren(
        el('div', { class: 'note note--good' }, 'Password changed. Please log in with it.'),
        el('a', { class: 'btn btn--block', href: '/login.html' }, 'Log in'));
    } catch (err) {
      submit.disabled = false;
      submit.textContent = 'Continue';
      showError(alertBox, err);
    }
  });
</script>
</body>
</html>
