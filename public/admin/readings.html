<!doctype html>

<head>
<meta charset="utf-8">

<title>Meter readings — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<!--
  This screen moved into the Billing tab on 2026-08-20.

  A redirect rather than a deletion, and it is not tidiness. This is the URL
  somebody has open on a phone, in a corridor, halfway through a meter walk —
  it is bookmarked, it is in the browser history of every admin, and it is what
  the console linked to for months. A 404 there is a treasurer standing in
  front of a meter with nowhere to type the number.

  Kept for a release or two.

  A meta refresh and NOT a script. The site's CSP is `script-src 'self'`, so an
  inline `location.replace` is blocked and never runs — it looked like it
  worked only because the meta tag underneath it was doing the redirect the
  whole time. A separate .js file for one line would be a file to explain; the
  meta tag needs no scripting at all, which is also the only version that works
  for somebody with JavaScript off.
-->
<meta http-equiv="refresh" content="0; url=/admin/#billing">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<main class="page">
  <p class="muted">Readings are part of the Billing tab now. Taking you there…</p>
  <p><a class="btn" href="/admin/#billing">Open Billing</a></p>
</main>
</body>
</html>
