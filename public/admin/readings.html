<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meter readings — Diamond Park</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  .gridhead {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--s-4); flex-wrap: wrap;
    padding: var(--s-4); background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .progress { display: flex; align-items: center; gap: var(--s-3);
    font-family: var(--font-ui); font-size: var(--text-sm); color: var(--ink-muted); }
  .progress__track { width: 120px; height: 6px; background: #E4E2DB; border-radius: 3px; overflow: hidden; }
  .progress__fill { height: 100%; background: var(--accent); transition: width var(--transition); }

  .grid { width: 100%; border-collapse: collapse; }
  .grid th {
    padding: var(--s-2) var(--s-4); background: #F5F4EF; border-bottom: 1px solid var(--border);
    font-family: var(--font-ui); font-size: var(--text-xs); font-weight: 600;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-muted); text-align: left;
  }
  .grid td { padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--border); height: 56px; }
  .grid .flat { font-family: var(--font-ui); font-weight: 600; width: 88px; }
  /* Quiet by design: this is a rare, consequential act sitting on every row of
     a screen used at speed. It should be findable when looked for and never
     catch a thumb aimed at the reading box beside it. */
  .cell-action {
    display: block; margin-top: 2px; font-size: var(--text-xs); font-weight: 400;
    color: var(--ink-muted); border-bottom-color: transparent;
  }
  .cell-action:hover, .cell-action:focus { color: var(--accent); border-bottom-color: var(--accent-line); }
  .grid .prev { color: var(--ink-muted); font-family: var(--font-ui); width: 96px; }
  .grid .used { font-family: var(--font-ui); width: 92px; }
  .cell { width: 124px; }
  .msg { font-size: var(--text-sm); display: flex; align-items: baseline; gap: var(--s-3); }
  .msg__saved { font-family: var(--font-ui); font-size: var(--text-xs); white-space: nowrap; }
  .msg--error { color: var(--overdue); }
  .msg--warn  { color: var(--awaiting); }
  .msg--ok    { color: var(--accent); font-family: var(--font-ui); }

  .footbar {
    position: sticky; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--border); padding: var(--s-4);
    display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap;
  }
  .previewpanel { padding: 0 var(--s-4) var(--s-4); }
  .import { padding: var(--s-4); border-bottom: 1px solid var(--border); background: #FBFAF6; }
  .import textarea {
    width: 100%; min-height: 96px; font-family: var(--font-ui);
    font-variant-numeric: tabular-nums; font-size: var(--text-sm);
    border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: var(--s-3);
  }
</style>
</head>
<body>

<div class="viewbar" id="viewbar" hidden></div>

<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <button class="appbar__action" id="logout" type="button">Log out</button>
</header>

<main class="page page--wide" id="main">
  <p class="muted">Loading the grid…</p>
</main>

<script type="module" src="../js/admin-readings.js"></script>
</body>
</html>
