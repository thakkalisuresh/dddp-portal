<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who owes what — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Two blocks, STACKED. Side by side, the eye adds across them — and a total
     of a monthly bill and a quarterly one reconciles against neither bank
     statement. The layout is part of the rule, not decoration on it. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s-3); }
  .tile {
    display: flex; flex-direction: column; gap: var(--s-1);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: var(--s-3); background: var(--surface);
  }
  .tile__big { font-size: var(--text-xl); font-family: var(--font-ui); }
  .is-overdue td { color: var(--overdue); }
</style>
</head>
<body>

<div class="viewbar" id="viewbar" hidden></div>

<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <button class="appbar__action" id="logout" type="button">Log out</button>
</header>

<main class="page stack--lg stack" id="main">
  <p class="muted">Loading…</p>
</main>

<script type="module" src="/js/admin-dues.js"></script>
</body>
</html>
