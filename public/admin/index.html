<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  .tabs { display: flex; gap: var(--s-1); flex-wrap: wrap; border-bottom: 1px solid var(--border);
          padding: 0 var(--s-4); background: var(--surface); }
  .tab { font-family: var(--font-ui); font-size: var(--text-sm); padding: var(--s-3) var(--s-3);
         border: none; background: none; color: var(--ink-muted); cursor: pointer;
         border-bottom: 2px solid transparent; min-height: var(--touch); }
  .tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .panel { padding: var(--s-4); }
  /* A folded-in section. Reads as a row of the page it belongs to, not as a
     card floating on top of it — same reasoning as .panel-sub in app.css. */
  .fold { border-top: 1px solid var(--border); }
  .fold:last-of-type { border-bottom: 1px solid var(--border); }
  .fold__summary { cursor: pointer; padding: var(--s-3) var(--s-4);
                   font-family: var(--font-ui); font-size: var(--text-sm);
                   color: var(--accent); display: flex; align-items: center;
                   gap: var(--s-3); min-height: var(--touch); }
  /* Home board. Rows are the whole control: the label, the count and the way
     in are one target, because a count you cannot click is a count you have to
     go and find. A row with nothing in it keeps its place and greys out —
     a board that empties into whitespace looks exactly like one that failed. */
  .board__h { font-family: var(--font-ui); font-size: var(--text-md); font-weight: 600;
              margin: 0; letter-spacing: -0.01em; }
  .board__row { display: flex; width: 100%; align-items: center; gap: var(--s-3);
                padding: var(--s-3) 0; border-top: 1px solid var(--border);
                font-family: var(--font-ui); font-size: var(--text-base);
                text-align: left; background: none; border-left: 0; border-right: 0;
                border-bottom: 0; color: var(--ink); text-decoration: none;
                cursor: pointer; min-height: var(--touch); }
  .board__row:hover { background: var(--accent-wash); }
  .board__t { flex: 1; min-width: 0; }
  .board__n { font-weight: 600; font-variant-numeric: tabular-nums; }
  .board__go { color: var(--ink-muted); }
  .board__row--quiet { color: var(--ink-muted); cursor: default; }
  .board__row--quiet:hover { background: none; }
  .board__row--quiet .board__n { font-weight: 400; }
  .board__fold > summary { list-style: none; }
  .board__fold > summary::-webkit-details-marker { display: none; }
  .board__fold > summary::after { content: '\25BE'; color: var(--ink-muted); }
  .board__fold[open] > summary::after { content: '\25B4'; }
  .board__sub { background: var(--accent-wash); padding: var(--s-2) var(--s-3) var(--s-3);
                border-top: 1px solid var(--accent-line); }
  .board__subrow { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap;
                   padding: var(--s-2) 0; border-bottom: 1px solid var(--accent-line);
                   font-family: var(--font-ui); font-size: var(--text-sm); }
  .board__subrow:last-of-type { border-bottom: 0; }
  .board__subrow b { font-variant-numeric: tabular-nums; min-width: 4ch; }
  .board__when { color: var(--ink-muted); flex: 1; }
  .rowitem { display: flex; gap: var(--s-4); align-items: center;
             padding: var(--s-3) 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .rowitem__main { flex: 1; min-width: 200px; }
  .rowitem b { font-family: var(--font-ui); }
  .rowitem div { font-size: var(--text-sm); color: var(--ink-muted);
                 font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
  .flat > summary { list-style: none; cursor: pointer; padding: var(--s-3) 0;
                    border-bottom: 1px solid var(--border); display: flex; gap: var(--s-3);
                    align-items: center; flex-wrap: wrap; min-height: var(--touch); }
  .flat > summary::-webkit-details-marker { display: none; }
  .flat > summary::before { content: '▸'; color: var(--ink-muted); font-size: var(--text-sm); }
  .flat[open] > summary::before { content: '▾'; }
  .flat__no { font-family: var(--font-ui); font-weight: 600; min-width: 3.5ch; }
  .flat__who { font-family: var(--font-ui); font-size: var(--text-sm); color: var(--ink-muted); flex: 1; }
  .person { border-bottom: 1px solid var(--border); padding: var(--s-3) 0 var(--s-4) var(--s-4); }
  .person__head { display: flex; gap: var(--s-2); align-items: baseline; flex-wrap: wrap;
                  margin-bottom: var(--s-2); font-family: var(--font-ui); }
  .person--past { opacity: .62; }
  .dirgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
             gap: var(--s-3); }
  .dircell { display: flex; flex-direction: column; gap: 2px; }
  .dircell__label { font-family: var(--font-ui); font-size: 10px; font-weight: 700;
                    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .dircell input { font: inherit; font-family: var(--font-ui); font-size: var(--text-sm);
                   padding: var(--s-2); border: 1px solid var(--border); border-radius: var(--radius);
                   background: var(--surface); color: var(--ink); min-height: var(--touch); }
  .dircell input:focus { border-color: var(--accent); outline: 2px solid var(--accent-line); }
  .dircell--dirty input { border-color: var(--accent); background: var(--accent-wash); }
  .dircell__static { font-family: var(--font-ui); font-size: var(--text-sm); padding: var(--s-2) 0;
                     display: flex; gap: var(--s-2); align-items: center; justify-content: space-between; }
  .dircell__none { color: var(--ink-muted); }
  .btn--pencil { font-family: var(--font-ui); font-size: var(--text-xs); padding: 2px var(--s-2);
                 border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
                 color: var(--accent); cursor: pointer; min-height: 28px; }
  .btn--pencil:hover { border-color: var(--accent-line); background: var(--accent-wash); }
  .dircell__actions { display: flex; gap: var(--s-2); margin-top: var(--s-2); }

  /* country picker */
  .mobilefield { display: flex; gap: var(--s-2); align-items: stretch; }
  .dial { position: relative; }
  .dial > summary { list-style: none; cursor: pointer; font-family: var(--font-ui);
                    font-size: var(--text-sm); padding: var(--s-2); min-height: var(--touch);
                    border: 1px solid var(--border); border-radius: var(--radius);
                    background: var(--surface); display: flex; align-items: center;
                    white-space: nowrap; }
  .dial > summary::-webkit-details-marker { display: none; }
  .dial > summary::after { content: '▾'; margin-left: 4px; color: var(--ink-muted); }
  .dial__pop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: 280px;
               max-width: 78vw; background: var(--surface); border: 1px solid var(--border-strong);
               border-radius: var(--radius); padding: var(--s-2); }
  .dial__list { max-height: 240px; overflow-y: auto; margin-top: var(--s-2); }
  .dial__opt { display: flex; justify-content: space-between; gap: var(--s-3); width: 100%;
               font-family: var(--font-ui); font-size: var(--text-sm); text-align: left;
               padding: var(--s-2); border: none; background: none; color: var(--ink);
               cursor: pointer; min-height: var(--touch); }
  .dial__opt:hover { background: var(--accent-wash); }
  .dial__opt--on { color: var(--accent); font-weight: 600; }
  .dial__code { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .mobilefield .input { flex: 1; min-width: 0; }
  /* ── Billing ───────────────────────────────────────────────────────────
     The meter grid and its furniture came here with admin-readings.js when
     Readings folded into Billing. The comments came with them: each one is a
     rendering fault somebody hit on a phone in a corridor. */
  .rail { display: flex; flex-direction: column; gap: var(--s-4); }
  .step { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); overflow: hidden; }
  .step[data-state="done"] { border-color: var(--accent-line); }
  .step[data-state="waiting"] { opacity: .55; }
  .step__head { display: flex; align-items: center; gap: var(--s-3); width: 100%;
                text-align: left; padding: var(--s-4); background: none; border: 0;
                font: inherit; color: inherit; cursor: pointer; min-height: var(--touch); }
  .step__head[disabled] { cursor: not-allowed; }
  .step__head--static { cursor: default; }
  .step__n { flex: none; width: 28px; height: 28px; border-radius: 50%;
             display: grid; place-items: center; font-family: var(--font-ui);
             font-size: var(--text-xs); font-weight: 600;
             border: 1.5px solid var(--border-strong); color: var(--ink-muted);
             background: var(--surface); }
  .step[data-state="open"] .step__n { border-color: var(--ink); color: var(--ink); }
  .step[data-state="done"] .step__n,
  .step__head--static .step__n { border-color: var(--accent); background: var(--accent); color: #fff; }
  .step__label { min-width: 0; }
  .step__title { font-family: var(--font-ui); font-weight: 600; display: block; }
  .step__sub { display: block; font-size: var(--text-sm); color: var(--ink-muted); }
  .step__body { padding: 0 var(--s-4) var(--s-4); display: none; }
  .step[data-state="open"] .step__body { display: block; }

  .billfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: var(--s-4); }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--s-4); }
  .total { display: flex; flex-direction: column; gap: 2px; }
  .total__k { font-family: var(--font-ui); font-size: var(--text-xs); font-weight: 600;
              letter-spacing: .11em; text-transform: uppercase; color: var(--ink-muted); }
  .total__v { font-family: var(--font-ui); font-size: var(--text-lg); font-weight: 600;
              font-variant-numeric: tabular-nums; }
  .total__v--big { font-size: var(--text-xl); }
  /* The amount is derived, never typed. It reads as a fact, not a box — which
     is the whole signal. A padlock repeated 89 times down a money column was
     read as a rendering fault, which is worse than saying nothing. */
  .amount__locked { font-family: var(--font-ui); font-weight: 600; color: var(--ink);
                    font-variant-numeric: tabular-nums; }
  .correct { background: #FBFAF6; border: 1px solid var(--border);
             border-radius: var(--radius); padding: var(--s-4); margin: var(--s-2) 0; }

  .contact__row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
                  padding: var(--s-3) 0; border-bottom: 1px solid var(--border); }
  .contact__row:last-child { border-bottom: 0; }
  .contact__flat { font-family: var(--font-ui); font-weight: 600; width: 48px; flex: none; }
  .contact__who { flex: 1; min-width: 150px; font-size: var(--text-sm); }
  .contact__who span { display: block; color: var(--ink-muted);
                       font-variant-numeric: tabular-nums; }

  .progress { display: flex; align-items: center; gap: var(--s-3);
    font-family: var(--font-ui); font-size: var(--text-sm); color: var(--ink-muted); }
  /* The counter and the "saved as you type" reassurance sit side by side on a
     laptop and fight for 375px on a phone — which is the width this screen is
     actually used at, standing in a corridor. The hint drops below rather than
     squeezing the progress bar it is explaining. */
  .billrow--progress { flex-wrap: wrap; gap: var(--s-2); }
  @media (max-width: 520px) {
    .billrow--progress > .small { flex-basis: 100%; }
    .progress__track { flex: 1; width: auto; }
    .progress { flex: 1; min-width: 100%; }
  }
  .progress__track { width: 120px; height: 6px; background: #E4E2DB; border-radius: 3px; overflow: hidden; }
  .progress__fill { height: 100%; background: var(--accent); transition: width var(--transition); }

  .grid { width: 100%; border-collapse: collapse; }
  .grid th {
    padding: var(--s-2) var(--s-4); background: #F5F4EF; border-bottom: 1px solid var(--border);
    font-family: var(--font-ui); font-size: var(--text-xs); font-weight: 600;
    letter-spacing: .11em; text-transform: uppercase; color: var(--ink-muted); text-align: left;
  }
  .grid th.r, .grid td.amount { text-align: right; }
  .grid td { padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--border); height: 56px; }
  .grid .flat { font-family: var(--font-ui); font-weight: 600; width: 64px; }
  .grid .prev { color: var(--ink-muted); font-family: var(--font-ui); width: 96px; }
  /* 92px wrapped "3.34 kg" onto two lines, which grew the row and made the
     misaligned divider below impossible to miss. */
  .grid .used { font-family: var(--font-ui); width: 112px; white-space: nowrap; }
  .cell { width: 124px; }
  /* NOT display:flex — this is a <td>. A table cell that becomes a flex
     container stops stretching to the row's height, takes `height: 56px` from
     .grid td literally, and draws its border-bottom 10-15px above every other
     cell's. The flex lives on an inner element instead. */
  .msg { font-size: var(--text-sm); vertical-align: middle; }
  .msg__row { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; }
  .msg__saved { font-family: var(--font-ui); font-size: var(--text-xs); white-space: nowrap; }
  .msg--error { color: var(--overdue); }
  .msg--warn  { color: var(--awaiting); }
  .msg--ok    { color: var(--accent); font-family: var(--font-ui); }

  .import { padding: var(--s-4); border: 1px solid var(--border);
            border-radius: var(--radius); background: #FBFAF6; }
  .import > summary { font-family: var(--font-ui); font-size: var(--text-sm);
                      font-weight: 600; cursor: pointer; }
  .import textarea {
    width: 100%; min-height: 96px; font-family: var(--font-ui);
    font-variant-numeric: tabular-nums; font-size: var(--text-sm);
    border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: var(--s-3);
  }

  .sev { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .09em;
         padding: 2px 7px; border-radius: var(--radius); border: 1px solid; }
  .sev--fatal { color: #fff; background: var(--overdue); border-color: var(--overdue); }
  .sev--error { color: var(--overdue); background: var(--overdue-wash); border-color: var(--overdue-line); }
  .sev--warn  { color: var(--awaiting); background: var(--awaiting-wash); border-color: var(--awaiting-line); }
</style>
</head>
<body>
<div class="viewbar" id="viewbar" hidden></div>
<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <a class="appbar__action" href="/dashboard.html">My bill</a>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="page page--wide" id="main"><p class="muted">Loading…</p></main>
<script type="module" src="../js/admin-console.js"></script>
</body>
</html>
