<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconcile the statement — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  .sect { padding: var(--s-4); border-bottom: 1px solid var(--border); background: var(--surface);
          display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; }
  /* The account picker. Two bank accounts (0042), two reconciliations, and the
     control that swaps between them — a segmented control rather than a filter,
     because the two lists must never be matched against each other. Each button
     carries the payee as a second line so a treasurer can tell which statement
     they are holding; 44px minimum, because this is tapped on a phone. */
  .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius);
         overflow: hidden; background: var(--surface); }
  .seg__btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
              padding: var(--s-2) var(--s-4); min-height: 44px; cursor: pointer;
              font-family: var(--font-ui); font-size: var(--text-sm); text-align: left;
              background: transparent; border: none; border-right: 1px solid var(--border);
              color: var(--ink-muted); }
  .seg__btn:last-child { border-right: none; }
  .seg__btn--on { background: var(--accent-wash); color: var(--ink); }
  .seg__btn b { font-weight: 600; }
  /* Forty flats owe the same rupee, so the picker past the ranked five can be a
     long list. It must not stretch the action column off the side of a phone. */
  .qact .input { max-width: 16rem; }
  .drop {
    margin: var(--s-4); padding: var(--s-6) var(--s-4); text-align: center;
    border: 1.5px dashed var(--border); border-radius: var(--radius); background: var(--surface);
  }
  .drop--over { border-color: var(--accent); background: var(--accent-wash, var(--surface)); }
  .tally { display: flex; gap: var(--s-5); flex-wrap: wrap; padding: var(--s-4);
           font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
  .tally div { display: flex; flex-direction: column; gap: 2px; }
  .tally b { font-size: var(--text-lg); }
  .tally span { font-size: var(--text-sm); color: var(--ink-muted); }
  /* Wraps for the same reason .qrow does: the action buttons will not share a
     358px row with the flat, the verdict and the amounts. This row never
     collapsed its meta to zero — `align-items: flex-start` and a wrapping
     .qact spared it that — but 112px of gutter turned one sentence into seven
     ragged lines beside a column of empty space. */
  .rrow { display: flex; gap: var(--s-4); align-items: flex-start;
          padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--border);
          flex-wrap: wrap; }
  .rrow--bad { background: var(--overdue-wash); }
  .rmeta { flex: 1 1 12rem; min-width: 0; font-family: var(--font-ui); }
  .rmeta b { display: block; }
  .rmeta div { font-size: var(--text-sm); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .rmeta .bad { color: var(--overdue); }
  .qact { display: flex; gap: var(--s-2); flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: var(--text-xs); border: 1px solid var(--border); border-radius: 999px;
         padding: 1px var(--s-2); color: var(--ink-muted); white-space: nowrap; }
  .privacy { margin: var(--s-4); padding: var(--s-3) var(--s-4); border-radius: var(--radius);
             background: var(--surface); border: 1px solid var(--border);
             font-size: var(--text-sm); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="viewbar" id="viewbar" hidden></div>
<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <a class="appbar__action" href="/admin/proofs.html">Proofs</a>
</header>
<main class="page page--wide" id="main"><p class="muted">Loading…</p></main>
<script type="module" src="../js/admin-statement.js"></script>
</body>
</html>
