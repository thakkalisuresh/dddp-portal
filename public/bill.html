<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your bill — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* One bill, one dominant element. These are the old dashboard hero's styles,
     moved with it — the hero now answers for one bill among several rather
     than being the whole screen. */
  .bill-hero { display: flex; flex-direction: column; gap: var(--s-2); }
  .bill-hero__top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .chart { display: flex; align-items: flex-end; gap: var(--s-2); height: 88px; }
  .chart__bar { flex: 1; background: #DCE8E2; border-top: 2.5px solid var(--accent); position: relative; min-height: 2px; }
  .chart__bar--now { background: #C4DDD1; }
  .chart__bar span {
    position: absolute; bottom: -22px; left: 0; right: 0; text-align: center;
    font-family: var(--font-ui); font-size: 10px; color: var(--ink-muted);
  }
  .chart-wrap { padding-bottom: var(--s-5); }
</style>
</head>
<body>

<div class="viewbar" id="viewbar" hidden></div>

<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <button class="appbar__action" id="logout" type="button">Log out</button>
</header>

<main class="page stack--lg stack" id="main">
  <p class="muted">Loading your bill…</p>
</main>

<script type="module" src="js/bill.js"></script>
</body>
</html>
