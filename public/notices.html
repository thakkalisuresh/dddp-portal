<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notices — Diamond Park</title>
<link rel="icon" href="/img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  .notice { border-left: 3px solid var(--accent); padding-left: var(--s-4); }
  .notice--event { border-left-color: var(--awaiting); }
  /* A committee types blank lines between paragraphs and hyphens down the side
     for a list. Without pre-wrap the browser eats all of it and an agenda
     arrives as one block of prose. */
  .notice__body, .comment__body { white-space: pre-wrap; }
  /* The board is a scanning surface, so the preview stops at three lines and
     the notice itself carries the rest. Before this, one long AGM notice could
     push everything after it below the fold. */
  .notice__body {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    line-clamp: 3; overflow: hidden;
  }
  /* Formatted notice bodies. pre-wrap here as well as on the plain preview,
     because a paragraph keeps the single line breaks that were typed in it. */
  .prose__p { white-space: pre-wrap; }
  .prose__p + .prose__p, .prose__list { margin-top: var(--s-3); }
  .prose__list { padding-left: var(--s-5); list-style: disc; }
  .prose__list li + li { margin-top: var(--s-1); }
  /* A heading that happens to be a link. It stays ink-coloured so the board
     does not read as a wall of links, and earns an underline on hover and
     focus so it is still discoverable and still keyboard-visible. */
  .plain { color: inherit; text-decoration: none; }
  .plain:hover, .plain:focus-visible { text-decoration: underline; }
  /* Attachments. Images are shown at a size that reads on a phone without
     letting a portrait photo take the whole screen; the cap is on height so a
     tall scan and a wide one both stay a glance rather than a scroll. */
  .attachments { margin-top: var(--s-3); display: grid; gap: var(--s-3); }
  .attachment__image {
    display: block; max-width: 100%; max-height: 320px;
    border: 1px solid var(--border); border-radius: var(--radius); background: #fff;
  }
  .comment { padding: var(--s-3) 0; border-bottom: 1px solid var(--border); }
  .comment__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
  .comment__who { font-family: var(--font-ui); font-size: var(--text-sm); font-weight: 600; }
  .comment__when { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--ink-muted); }
  .comment--hidden { opacity: .55; font-style: italic; }
  textarea.input { min-height: 84px; font-family: var(--font-body); resize: vertical; }
</style>
</head>
<body>
<div class="viewbar" id="viewbar" hidden></div>
<header class="appbar">
  <span class="appbar__who" id="who">Loading…</span>
  <button class="appbar__action" id="logout" type="button">Log out</button>
</header>
<main class="page stack--lg stack" id="main"><p class="muted">Loading notices…</p></main>
<script type="module" src="js/notices.js"></script>
</body>
</html>
