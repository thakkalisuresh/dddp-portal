name = "dddp-portal"
main = "functions/index.js"

# This Worker is NOT the public site — pages/ is (diamondpark.pages.dev).
# It stays deployed for one reason: Pages Functions have no cron triggers, and
# the 3am late-fee / backup / prune job needs one. Its public route is off so
# there is exactly one URL residents can reach.
workers_dev = false
compatibility_date = "2026-08-01"

[assets]
directory = "public"
binding = "ASSETS"
# Without this the asset server answers static requests directly and the Worker
# never runs for them — which silently meant the CSP applied to JSON responses
# and to not a single HTML page.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dddp"
database_id = "56951152-d3c7-4476-a779-9ef9afe0b4d8"  # APAC — near Kerala
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "dddp-proofs"

[vars]
UPI_VPA = "qr.ddwelfare@sib"
UPI_PAYEE = "DD Diamond Park RWA"
# MUST match pages/wrangler.toml. The two deployments share one database, so a
# disagreement here means each one re-hashes what the other just wrote, and
# every login pays for two derives forever. Change both or neither.
#
# 100000 IS THE PLATFORM MAXIMUM. Not a default, not a budget decision.
#
# Raised to 200000 on 2026-08-12 and reverted within the hour, because every
# login on production returned 500:
#
#   NotSupportedError: Pbkdf2 failed: iteration counts above 100000 are not
#   supported (requested 200000).
#
# The CPU measurement that motivated the raise was accurate and beside the
# point: one derive costs ~27 ms on the edge and a 32 ms login returns "ok", so
# there IS budget headroom — there is simply no knob. This number cannot go up
# at any price until Cloudflare lifts the cap.
#
# `wrangler dev --local` DOES NOT ENFORCE THIS — a local probe accepted 600000
# happily. The failure is invisible until it reaches a deployed URL, which is
# how it got past a green test suite and a local check.
#
# If stronger hashing is genuinely wanted, the lever is a different KDF
# (scrypt/argon2 via WASM), which crypto.js rejected on other grounds. It is
# not this line. test/deploy-config.test.js now refuses anything above 100000.
PBKDF2_ITERATIONS = "100000"

# Secrets (wrangler secret put): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, MAIL_FROM,
# GOOGLE_BACKUP_FOLDER_ID, and optionally GOOGLE_BACKUP_CLIENT_ID,
# GOOGLE_BACKUP_CLIENT_SECRET, GOOGLE_BACKUP_REFRESH_TOKEN.
#
# Two Google accounts. The shared GOOGLE_ trio is the ASSOCIATION's, because
# `/forgot` emails 99 residents and the From line should say so. The
# GOOGLE_BACKUP_ trio overrides it for the nightly upload only, so the copies
# live in a committee member's personal Drive — files are charged to whoever
# creates them, and the association's own quota is for its own documents.
# Unset, the backup falls back to the shared trio and one account does both.
#
# The GOOGLE_ secrets belong HERE as well as on Pages. The 3am backup runs from
# this Worker's cron and nowhere else, so secrets set only on Pages leave the
# upload returning early every night while the Export tab — which does run on
# Pages — reports a valid token. `npm run doctor` calls that state
# BACKUP-CRON-UNCONFIGURED rather than letting it read as healthy.
#
# Mint them with `npm run google:auth`, and publish the OAuth consent screen to
# Production, not Testing: a refresh token issued in Testing expires after seven
# days and the backup then stops silently.

[triggers]
# UTC, always — Cloudflare crons have no timezone, and none of the expressions
# below shifts with daylight saving anywhere.
#
#   30 18 * * *  →  00:00 IST (next day) — late fees, and ONLY late fees.
#   0  3  * * *  →  08:30 IST — the sweep and the Telegram digest.
#   0  22 * * *  →  03:30 IST (next day) — the Drive backup, and only that.
#
# LATE FEES MOVED TO MIDNIGHT because that is the committee's rule: a bill not
# paid when the due date begins is late, full stop. They used to ride with the
# digest at 08:30, which charged residents 32 hours after the moment they were
# told about — the fee applied the day AFTER the due date, and then only once
# somebody's morning job woke up.
#
# The digest stays at 08:30 regardless. A Telegram message at midnight is one
# somebody mutes, and muting it takes the 22 warnings only the digest reports
# with it. It now reports fees applied eight hours earlier, which is fine — the
# digest's job is to tell the treasurer what happened, not to make it happen.
#
# Cron triggers are scheduled, not punctual, so this alone would deliver
# "midnight, roughly". applyLateFeeToBill closes the gap on the read path; see
# the note there for why the QR makes that a money question and not a nicety.
#
# The IST times are the anchor. Pacific was the other candidate and drifts by an
# hour twice a year against it; the building is in Thrissur, so Kerala's clock
# is the one held still.
crons = ["30 18 * * *", "0 3 * * *", "0 22 * * *"]
