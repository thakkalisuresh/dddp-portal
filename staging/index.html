<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Park — staging review</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/theme.css">
<style>
  /* The reviewer's chrome. Deliberately plainer than the thing it frames —
     nothing here should compete with the prototype for attention. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font-family: var(--font); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .shell { display: grid; grid-template-columns: 296px 1fr; min-height: 100vh; }
  @media (max-width: 60rem) { .shell { grid-template-columns: 1fr; } }

  .side {
    background: var(--surface); border-right: 1px solid var(--separator);
    padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 20px;
    max-height: 100vh; overflow-y: auto; position: sticky; top: 0;
  }
  @media (max-width: 60rem) { .side { position: static; max-height: none; } }

  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  .brand p { margin: 0; font-size: 13px; color: var(--label-2); }

  .lbl {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--label-3); margin: 0 0 6px;
  }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: 10px; }
  .seg button {
    flex: 1; min-height: 34px; border: 0; border-radius: 7px; background: none;
    color: var(--label-2); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .seg button[aria-pressed='true'] { background: var(--surface); color: var(--label); font-weight: 650; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

  select.pick {
    width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 14px;
    background: var(--surface); color: var(--label);
    border: 1px solid var(--border); border-radius: 9px;
  }

  .nav { display: flex; flex-direction: column; gap: 14px; }
  .nav h3 { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--label-3); }
  .nav a {
    display: block; padding: 8px 10px; border-radius: 8px;
    color: var(--label); text-decoration: none; font-size: 14px;
  }
  .nav a small { display: block; color: var(--label-3); font-size: 12px; }
  .nav a:hover { background: var(--surface-2); }
  .nav a.on { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
  .nav a.on small { color: var(--accent); opacity: .8; }

  .stage {
    padding: 28px 24px 48px; display: flex; flex-direction: column;
    align-items: center; gap: 18px; background: var(--bg);
  }
  .stage__bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; max-width: 1100px; }
  .stage__bar h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .stage__bar p { margin: 0; font-size: 13px; color: var(--label-2); flex: 1 1 260px; }
  .stage__bar a { font-size: 13px; color: var(--accent); }

  .device {
    background: var(--surface); border-radius: 30px; padding: 10px;
    box-shadow: 0 20px 60px rgb(20 20 30 / .18), 0 0 0 1px var(--separator);
    transition: width 240ms cubic-bezier(.32,.72,0,1);
  }
  .device--phone { width: 412px; }
  .device--tablet { width: 800px; }
  .device--desktop { width: 100%; max-width: 1180px; border-radius: 14px; padding: 8px; }
  .device iframe {
    width: 100%; height: 812px; border: 0; border-radius: 22px; background: var(--bg); display: block;
  }
  .device--desktop iframe { height: 760px; border-radius: 8px; }
  @media (max-width: 60rem) { .device--phone, .device--tablet { width: 100%; max-width: 412px; } }

  .foot { font-size: 12px; color: var(--label-3); max-width: 62ch; text-align: center; }
  .foot code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1>Diamond Park</h1>
      <p>Staging redesign · every flow</p>
    </div>

    <div>
      <p class="lbl">Who you are</p>
      <select class="pick" id="persona">
        <option value="due">Resident — bill due</option>
        <option value="overdue">Resident — overdue, late fee</option>
        <option value="paid">Resident — settled</option>
        <option value="landlord">Owner — tenant pays</option>
        <option value="admin">Treasurer</option>
      </select>
    </div>

    <div>
      <p class="lbl">Device</p>
      <div class="seg" id="device">
        <button type="button" data-v="phone" aria-pressed="true">Phone</button>
        <button type="button" data-v="tablet" aria-pressed="false">Tablet</button>
        <button type="button" data-v="desktop" aria-pressed="false">Desktop</button>
      </div>
    </div>

    <div>
      <p class="lbl">Appearance</p>
      <div class="seg" id="theme">
        <button type="button" data-v="light" aria-pressed="true">Light</button>
        <button type="button" data-v="dark" aria-pressed="false">Dark</button>
      </div>
    </div>

    <div>
      <p class="lbl">Text size</p>
      <div class="seg" id="text">
        <button type="button" data-v="m" aria-pressed="true">Normal</button>
        <button type="button" data-v="l" aria-pressed="false">Large</button>
        <button type="button" data-v="xl" aria-pressed="false">Largest</button>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="stage">
    <div class="stage__bar">
      <h2 id="stageTitle">Your bill</h2>
      <p id="stageNote"></p>
      <a href="portal.html" target="_blank" rel="noopener">Open full size ↗</a>
    </div>
    <div class="device device--phone" id="device-frame">
      <iframe id="frame" src="portal.html#/bill" title="Diamond Park prototype"></iframe>
    </div>
    <p class="foot">
      Nothing here touches the live portal. This is <code>staging/</code> —
      static files, mock data, no server and no database.
    </p>
  </main>
</div>

<script type="module">
const SCREENS = [
  ['Getting in', [
    ['#/',             'Public front door', 'What a passer-by sees'],
    ['#/login',        'Log in', 'One decision, two fields'],
    ['#/forgot',       'Forgotten password', 'Three stages, one screen'],
    ['#/set-password', 'First login', 'Forced, and it says why'],
  ]],
  ['Resident', [
    ['#/bill',      'The bill', 'The hero screen'],
    ['#/pay',       'Paying', 'Four routes, none of them dead ends'],
    ['#/proof',     'Send a screenshot', 'Optional, and it says so'],
    ['#/usage',     'Gas use', 'Chart, then the same numbers as a list'],
    ['#/notices',   'Notice board', 'Filtered, unread marked'],
    ['#/notice/n1', 'One notice', 'With replies'],
    ['#/me',        'You', 'Details, security, text size, help'],
  ]],
  ['Committee', [
    ['#/admin',           'The board', 'What is waiting on you'],
    ['#/admin/month',     'The month', 'Rate → readings → check → publish'],
    ['#/admin/bills',     'Bills', 'Filter and chase'],
    ['#/admin/proofs',    'Screenshots', 'Bulk-approve, then the exceptions'],
    ['#/admin/reconcile', 'Bank statement', 'Match, then delete it'],
    ['#/admin/residents', 'The building', 'Keyed by flat, not by person'],
    ['#/admin/roster',    'Import roster', 'Preview before anything is written'],
    ['#/admin/notices',   'Post a notice', 'Compose and manage'],
  ]],
];

const frame = document.getElementById('frame');
const nav = document.getElementById('nav');
const stageTitle = document.getElementById('stageTitle');
const stageNote = document.getElementById('stageNote');

let current = '#/bill';

nav.replaceChildren(...SCREENS.map(([heading, items]) => {
  const box = document.createElement('div');
  const h = document.createElement('h3'); h.textContent = heading; box.append(h);
  for (const [hash, label, note] of items) {
    const a = document.createElement('a');
    a.href = hash; a.dataset.hash = hash;
    a.innerHTML = `${label}<small>${note}</small>`;
    a.addEventListener('click', (e) => { e.preventDefault(); show(hash, label, note); });
    box.append(a);
  }
  return box;
}));

function show(hash, label, note) {
  current = hash;
  frame.src = `portal.html${hash}`;
  stageTitle.textContent = label;
  stageNote.textContent = note;
  for (const a of nav.querySelectorAll('a')) a.classList.toggle('on', a.dataset.hash === hash);
}
show('#/bill', 'The bill', 'The hero screen');

function segment(id, apply) {
  const box = document.getElementById(id);
  box.addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    for (const b of box.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === btn));
    apply(btn.dataset.v);
  });
}

segment('device', (v) => {
  document.getElementById('device-frame').className = `device device--${v}`;
});
segment('theme', (v) => {
  document.documentElement.setAttribute('data-theme', v);
  frame.contentWindow?.postMessage({ dp: 'theme', value: v }, '*');
});
segment('text', (v) => {
  frame.contentWindow?.postMessage({ dp: 'text', value: v }, '*');
});

document.getElementById('persona').addEventListener('change', (e) => {
  const v = e.target.value;
  frame.contentWindow?.postMessage({ dp: 'persona', value: v }, '*');
  // The treasurer's screens are behind a different tab; take them there.
  if (v === 'admin' && !current.startsWith('#/admin')) show('#/admin', 'The board', 'What is waiting on you');
  if (v !== 'admin' && current.startsWith('#/admin')) show('#/bill', 'The bill', 'The hero screen');
});

// The frame starts light unless the reviewer says otherwise, so the two
// panels never disagree about what mode they are in.
frame.addEventListener('load', () => {
  const theme = document.querySelector('#theme button[aria-pressed="true"]').dataset.v;
  const text = document.querySelector('#text button[aria-pressed="true"]').dataset.v;
  const persona = document.getElementById('persona').value;
  frame.contentWindow.postMessage({ dp: 'theme', value: theme }, '*');
  frame.contentWindow.postMessage({ dp: 'text', value: text }, '*');
  frame.contentWindow.postMessage({ dp: 'persona', value: persona }, '*');
});
document.documentElement.setAttribute('data-theme', 'light');
</script>
</body>
</html>
