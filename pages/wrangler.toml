# Cloudflare Pages — the public URL (diamondpark.pages.dev).
#
# Pages allows only one wrangler.toml per directory and rejects --config, so
# this lives in its own folder. The Worker config at ../wrangler.toml stays put.
#
# The Worker remains deployed alongside this with its workers.dev route OFF,
# purely to run the 3am cron: Pages Functions still have no scheduled triggers.
# Both bind to the SAME D1 and R2 — one database, one bucket, two entry points.

name = "diamondpark"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "dddp"
database_id = "56951152-d3c7-4476-a779-9ef9afe0b4d8"
# LOCAL `wrangler pages dev` only. This key does NOT affect deployed previews
# -- see the [env.preview] block at the bottom, which is what does. Keeping it
# means a local dev session also stays off production.
#
# Staging is rebuilt from a prod export by `npm run staging:refresh`. Data only
# ever moves prod -> staging; nothing here is ever promoted back up.
preview_database_id = "adf039cd-4cec-4e66-9395-fd4a548cd01c"  # dddp-migtest

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "dddp-proofs"
# Same reasoning as the D1 preview binding above. Without this, a test payment
# proof uploaded while trying a feature out lands in the real bucket, mixed in
# with residents' actual payment screenshots and backed up to Drive at 3am
# alongside them. Staging uploads go somewhere disposable instead.
preview_bucket_name = "dddp-proofs-staging"

[vars]
UPI_VPA = "qr.ddwelfare@sib"
UPI_PAYEE = "DD Diamond Park RWA"
# MUST match ../wrangler.toml — see the note there. This is the copy that
# matters for residents: the site runs here, the cron Worker runs there, and
# both hash against the same D1.
#
# 100000 is Cloudflare's hard maximum for PBKDF2, not a tuning choice. Raising
# it took production login down on 2026-08-12 — and THIS file is the one that
# did it, because this is where resident logins are served.
PBKDF2_ITERATIONS = "100000"

# GOOGLE_MAPS_KEY — optional, and the map works without it.
#
# Unset, the homepage uses Google's keyless `output=embed` form: same map, same
# pin, no account. Set, it uses the documented Maps Embed API, which is free
# with unlimited requests but wants a Cloud project behind it.
#
# A Maps key is PUBLIC — it is served in the page source, so it is a var here
# and not a secret. What protects it is the restriction, not the hiding, and
# both halves are required:
#   * Application restriction  → HTTP referrers: diamondpark.pages.dev/*
#   * API restriction          → Maps Embed API, and nothing else
# Without the second, a lifted key can be spent on APIs that do bill.
#
# Put it on an account the ASSOCIATION owns. The old site's map is keyed to a
# Cloud project nobody can reach, which is how it became unfixable.
#
GOOGLE_MAPS_KEY = "AIzaSyCpEURTEHHTSKK5SOM2EXuTJkv6WtHvSSY"

# ---------------------------------------------------------------------------
# Preview deployments -- every branch that is not `main`.
#
# THIS is what binds a preview to staging. The `preview_database_id` line above
# does not: that key is a WORKERS convention, read by `wrangler dev`, and Pages
# ignores it at deploy time. A deploy carrying only that line looks correct in
# the config and serves PRODUCTION data. That was found the hard way -- a probe
# row present in dddp-migtest and absent from dddp came back absent from the
# staging site, which meant the site was reading production.
#
# Pages resolves bindings by ENVIRONMENT: the top level of this file is
# production, [env.preview] is every other branch. Nothing is inherited into an
# env, so the vars are repeated here too.
#
# The check that matters after any change here is NOT that the config reads
# correctly. It is that a row visible in one database and not the other shows
# up on the right site.
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "dddp-migtest"
database_id = "adf039cd-4cec-4e66-9395-fd4a548cd01c"

[[env.preview.r2_buckets]]
binding = "PROOFS"
bucket_name = "dddp-proofs-staging"

[env.preview.vars]
UPI_VPA = "qr.ddwelfare@sib"
UPI_PAYEE = "DD Diamond Park RWA"
PBKDF2_ITERATIONS = "100000"
GOOGLE_MAPS_KEY = "AIzaSyCpEURTEHHTSKK5SOM2EXuTJkv6WtHvSSY"
