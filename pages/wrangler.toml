# Cloudflare Pages — the public URL (diamondpark.pages.dev).
#
# Pages allows only one wrangler.toml per directory and rejects --config, so
# this lives in its own folder. The Worker config at ../wrangler.toml stays put.
#
# The Worker remains deployed alongside this with its workers.dev route OFF,
# purely to run the 3am cron: Pages Functions still have no scheduled triggers.
# Both bind to the SAME D1 and R2 — one database, one bucket, two entry points.

name = "diamondpark"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "dddp"
database_id = "56951152-d3c7-4476-a779-9ef9afe0b4d8"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "dddp-proofs"

[vars]
UPI_VPA = "qr.ddwelfare@sib"
UPI_PAYEE = "DD Diamond Park RWA"
# MUST match ../wrangler.toml — see the note there. This is the copy that
# matters for residents: the site runs here, the cron Worker runs there, and
# both hash against the same D1.
PBKDF2_ITERATIONS = "200000"

# GOOGLE_MAPS_KEY — optional, and the map works without it.
#
# Unset, the homepage uses Google's keyless `output=embed` form: same map, same
# pin, no account. Set, it uses the documented Maps Embed API, which is free
# with unlimited requests but wants a Cloud project behind it.
#
# A Maps key is PUBLIC — it is served in the page source, so it is a var here
# and not a secret. What protects it is the restriction, not the hiding, and
# both halves are required:
#   * Application restriction  → HTTP referrers: diamondpark.pages.dev/*
#   * API restriction          → Maps Embed API, and nothing else
# Without the second, a lifted key can be spent on APIs that do bill.
#
# Put it on an account the ASSOCIATION owns. The old site's map is keyed to a
# Cloud project nobody can reach, which is how it became unfixable.
#
GOOGLE_MAPS_KEY = "AIzaSyCpEURTEHHTSKK5SOM2EXuTJkv6WtHvSSY"
